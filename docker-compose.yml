# The Partli backend. `docker compose up` gives you the API on :8080.
#
# Postgres is gone: the backend keeps case state in memory with a 24 h TTL, which
# is the variant the spec sanctions for the MVP. The catalogue is read-only data
# on disk, so there is nothing durable left to store.

services:
  api:
    build: ./backend
    container_name: partli-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Read-only: the backend loads catalogues at boot and never writes here.
      - ./data:/data:ro
    environment:
      PARTLI_DATA_DIR: /data
      # Where the customer approval page is served from. Must be reachable from
      # the customer's phone, not just from this container.
      PARTLI_WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
    healthcheck:
      # Boot preloads every catalogue before binding the port, so the start
      # period covers that rather than the healthcheck flapping through it.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 15s
      timeout: 3s
      start_period: 40s
      retries: 3
